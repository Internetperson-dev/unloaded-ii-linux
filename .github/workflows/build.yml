
name: Build Release Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          echo "tag=v${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "base=v${BASE}" >> "$GITHUB_OUTPUT"
          echo "full=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail

          # Mirror list supported by Ubuntu 24.04 GitHub runners.
          mirrors=(
            "http://azure.archive.ubuntu.com/ubuntu/"
            "http://archive.ubuntu.com/ubuntu/"
            "http://us.archive.ubuntu.com/ubuntu/"
          )

          # Verify Ubuntu's APT sources use the mirror list.
          if ! grep -RqsF \
            "mirror+file:/etc/apt/apt-mirrors.txt" \
            /etc/apt/sources.list.d/; then
            echo "::error::APT mirror list is not configured"
            exit 1
          fi

          APT_OPTS=(
            -o Acquire::Retries=0
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o APT::Update::Error-Mode=any
            -o DPkg::Lock::Timeout=120
            -o Dpkg::Use-Pty=0
          )

          # Stop a command after 30 seconds without output.
          run_with_idle_timeout() {
            python3 - "$@" <<'PY'
          import os
          import selectors
          import signal
          import subprocess
          import sys
          import time

          proc = subprocess.Popen(
              sys.argv[1:],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              start_new_session=True,
          )

          selector = selectors.DefaultSelector()
          selector.register(proc.stdout, selectors.EVENT_READ)
          last_output = time.monotonic()

          while selector.get_map():
              events = selector.select(timeout=1)

              for key, _ in events:
                  data = os.read(key.fd, 65536)
                  if data:
                      sys.stdout.buffer.write(data)
                      sys.stdout.buffer.flush()
                      last_output = time.monotonic()
                  else:
                      selector.unregister(key.fileobj)

              if time.monotonic() - last_output >= 30:
                  print(
                      "\n::warning::No output for 30 seconds. Switching mirror.",
                      file=sys.stderr,
                      flush=True,
                  )
                  try:
                      os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass

                  try:
                      proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(proc.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      proc.wait()

                  sys.exit(124)

          sys.exit(proc.wait())
          PY
          }

          downloaded=false

          for mirror in "${mirrors[@]}"; do
            echo "::group::Trying Ubuntu mirror: $mirror"

            # Use only this mirror for the current attempt.
            printf '%s\n' "$mirror" | \
              sudo tee /etc/apt/apt-mirrors.txt > /dev/null

            if run_with_idle_timeout \
                sudo -E timeout 240 \
                apt-get "${APT_OPTS[@]}" update \
              && run_with_idle_timeout \
                sudo -E timeout 480 \
                apt-get "${APT_OPTS[@]}" install -y \
                  --download-only \
                  --no-install-recommends \
                  mingw-w64 p7zip-full zip; then

              downloaded=true
              echo "Successfully downloaded dependencies"
              echo "::endgroup::"
              break
            fi

            echo "::warning::Mirror failed: $mirror"
            echo "::endgroup::"
          done

          if [ "$downloaded" != true ]; then
            echo "::error::All Ubuntu mirrors failed"
            exit 1
          fi

          # Packages are already downloaded.
          # Do not interrupt dpkg with the inactivity watchdog.
          sudo -E timeout 300 \
            apt-get "${APT_OPTS[@]}" install -y \
              --no-download \
              --no-install-recommends \
              mingw-w64 p7zip-full zip

      - name: Create vendor directory and download Reloaded-II
        run: |
          mkdir -p vendor/reloaded-release/extracted
          curl -sL -o vendor/reloaded-release/Release.zip \
            https://github.com/Reloaded-Project/Reloaded-II/releases/download/1.30.2/Release.zip
          unzip -qo vendor/reloaded-release/Release.zip -d vendor/reloaded-release/extracted

      - name: Download .NET Desktop Runtime
        run: |
          curl -sL -o vendor/reloaded-release/windowsdesktop-runtime-win-x64.zip \
            "https://aka.ms/dotnet/9.0/windowsdesktop-runtime-win-x64.zip"

      - name: Download .NET Runtime
        run: |
          curl -sL -o vendor/reloaded-release/dotnet-runtime-win-x64.zip \
            "https://aka.ms/dotnet/9.0/dotnet-runtime-win-x64.zip"

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build and package
        env:
          DROPIN_VERSION: ${{ steps.version.outputs.full }}
        run: ./scripts/package-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unloaded-ii-${{ steps.version.outputs.full }}
          path: dist/unloaded-ii-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/unloaded-ii-*.zip
          generate_release_notes: true
